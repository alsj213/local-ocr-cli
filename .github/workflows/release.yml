name: Release

# Publishes to npm via Trusted Publishing (OIDC) — no token, no 2FA prompt,
# automatic provenance. Triggered by pushing a version tag (vX.Y.Z).
#
# Setup (done via CLI, needs 2FA once):
#   npm trust github --file=release.yml --repository=alsj213/local-ocr-cli --allow-publish
#
# NOTE: do NOT set registry-url on actions/setup-node here — it writes an
# .npmrc with a placeholder _authToken that npm prefers over OIDC token
# exchange, causing E404 on publish (npm/cli#8730, setup-node#1477).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # OIDC trusted publishing needs npm >= 11.15.0. GitHub-hosted runners
      # carry npm 10.9.x with Node 22, which has NO oidc.js — without this
      # upgrade npm never attempts the OIDC token exchange and fails ENEEDAUTH.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm (OIDC trusted publishing)
        # No NPM_TOKEN needed: npm authenticates via the OIDC id-token minted
        # by GitHub Actions (permissions.id-token: write above). Provenance
        # is generated automatically. Requires npm >= 11.15 (upgraded above).
        run: npm publish --provenance --access public
